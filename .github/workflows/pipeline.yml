name: Automated Data Pipeline

# Runs automatically every Monday at 6:00 AM UTC, and can also be triggered manually
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python scripts/pipeline.py

      - name: Commit updated outputs
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data/cleaned_superstore_sales_auto.csv reports/superstore_kpi_report.xlsx
          git commit -m "Automated pipeline run: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
